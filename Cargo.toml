[package]
name = "ofac-sanctioned-digital-currency-addresses"
version = "0.0.4"
edition = "2024"
description = "Generate sanctioned digital currency address lists from OFAC SDN XML"
license = "MIT"
repository = "https://github.com/RandyMcMillan/ofac-sanctioned-digital-currency-addresses"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
roxmltree = "0.20"
serde_json = "1"
zip = "2"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
